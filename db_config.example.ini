; Skopiuj ten plik jako db_config.ini i uzupełnij.
; Wartości znajdziesz w PyCharm: Database -> prawy klik na połączenie -> Properties -> zakładka General.

[sqlserver]
; Host z PyCharm. Nazwana instancja: localhost\SQLEXPRESS, inny port: localhost,1433
server = localhost
; Database z PyCharm - baza musi istnieć, tabele utworzą się same
database = Cenniki
; Schemat tabel
schema = dbo

; Logowanie kontem Windows ("Windows credentials" w PyCharm): zostaw user i password puste.
; Logowanie SQL ("User & Password" w PyCharm): uzupełnij oba.
user =
password =

; Sterownik ODBC zainstalowany w Windows (sprawdzisz: python -c "import pyodbc; print(pyodbc.drivers())")
driver = ODBC Driver 18 for SQL Server
; yes = akceptuj certyfikat serwera bez weryfikacji (typowe dla lokalnego serwera)
trust_server_certificate = yes

[smtp]
; Wysyłka maila, gdy u któregoś źródła zmienią się ceny.
; Usuń tę sekcję (albo zostaw puste host), żeby wyłączyć maile.

; Serwer poczty Twojej domeny (dane od hostingu, np. mail.twojadomena.pl)
host = mail.twojadomena.pl
; 465 dla security = ssl, 587 dla security = starttls
port = 465
security = ssl

; Login i hasło skrzynki, z której wychodzi mail (zwykle pełny adres e-mail)
user = cenniki@twojadomena.pl
password =

; Nadawca (domyślnie = user) i odbiorcy (kilku oddziel przecinkami)
from = Cenniki <cenniki@twojadomena.pl>
to = ty@twojadomena.pl
